[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

lib_deps = fastled/FastLED@^3.10.3


[env:nodemcuv2_ota]
platform = espressif8266
board = nodemcuv2
framework = arduino

upload_protocol = espota
upload_port = 192.168.0.100

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

lib_deps = fastled/FastLED@^3.10.3